<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equalizer Online - GQX 3102</title>

<style>
:root {
  --bg: #101214;
  --rack: #24272b;
  --panel: #30343a;
  --panel-dark: #181a1d;
  --border: #555b63;
  --text: #e6e6e6;
  --muted: #9da3aa;
  --green: #35e477;
  --yellow: #f4d94e;
  --red: #ff4757;
  --blue: #49a5ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    linear-gradient(135deg, #111315, #292d32 50%, #111315);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
select,
input {
  font: inherit;
}

button,
select {
  background: #202328;
  color: var(--text);
  border: 1px solid #60666e;
  border-radius: 4px;
  padding: 8px 12px;
  cursor: pointer;
}

button:hover,
select:hover {
  border-color: var(--blue);
}

button.active {
  background: var(--blue);
  color: #101214;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 16px 22px;
  background: #191b1e;
  border-bottom: 2px solid #080909;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 2px solid #777d84;
  border-radius: 50%;
  font-size: 23px;
  font-weight: bold;
  color: white;
}

h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.status {
  color: var(--green);
  font-size: 12px;
  text-align: right;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 20px;
  background: #202328;
  border-bottom: 1px solid #080909;
}

.rack {
  margin: 18px;
  padding: 14px;
  background: linear-gradient(#3a3e43, #24272b);
  border: 2px solid #111315;
  border-radius: 8px;
  box-shadow:
    inset 0 0 0 1px #666b72,
    0 8px 25px rgba(0,0,0,.4);
}

.rack-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 10px 12px;
  background: #17191c;
  border: 1px solid #090a0b;
  border-radius: 4px;
}

.rack-title strong {
  letter-spacing: 1px;
}

.rack-title span {
  color: var(--muted);
  font-size: 12px;
}

.channels {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.channel {
  min-width: 0;
  padding: 12px;
  background: linear-gradient(#30343a, #24272c);
  border: 1px solid #666c73;
  border-radius: 5px;
}

.channel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #626870;
}

.channel-header h2 {
  margin: 0;
  font-size: 15px;
}

.channel-header small {
  color: var(--muted);
  font-size: 10px;
}

.top-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.control {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.control label {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
}

.control strong {
  font-size: 12px;
  color: white;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--blue);
  cursor: pointer;
}

.meter-area {
  display: grid;
  grid-template-columns: 1fr 65px;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.meter {
  display: flex;
  align-items: end;
  gap: 3px;
  height: 45px;
  padding: 5px;
  background: #0d0f11;
  border: 1px solid #555b62;
  border-radius: 3px;
}

.meter span {
  flex: 1;
  height: 100%;
  background: var(--green);
  opacity: .18;
  border-radius: 1px;
}

.meter span:nth-last-child(-n+3) {
  background: var(--yellow);
}

.meter span:last-child {
  background: var(--red);
}

.clip {
  height: 45px;
  display: grid;
  place-items: center;
  background: #101214;
  border: 1px solid #555b62;
  border-radius: 3px;
  color: var(--red);
  font-size: 10px;
  font-weight: bold;
}

.eq-wrapper {
  overflow-x: auto;
  padding-bottom: 5px;
}

.eq-scale {
  display: flex;
  justify-content: space-between;
  min-width: 700px;
  padding: 0 5px 8px;
  color: var(--muted);
  font-size: 10px;
}

.eq-bands {
  display: grid;
  grid-template-columns: repeat(31, minmax(22px, 1fr));
  gap: 4px;
  min-width: 700px;
  height: 285px;
  padding: 10px 6px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      rgba(255,255,255,.08) 32px
    ),
    #1b1e22;
  border: 1px solid #555b62;
  border-radius: 4px;
}

.band {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}

.band-value {
  width: 100%;
  text-align: center;
  color: white;
  font-size: 9px;
}

.band input {
  width: 245px;
  height: 20px;
  transform: rotate(-90deg);
  accent-color: #d8dce0;
}

.band-frequency {
  width: 100%;
  text-align: center;
  color: var(--muted);
  font-size: 8px;
  white-space: nowrap;
}

.band-center {
  color: var(--green);
}

.bottom-controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.range-buttons {
  display: flex;
  gap: 5px;
}

.range-buttons button {
  flex: 1;
  padding: 7px 3px;
  font-size: 11px;
}

.eq-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.eq-buttons button {
  flex: 1;
}

.footer {
  padding: 15px 20px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

@media (max-width: 850px) {
  .channels {
    grid-template-columns: 1fr;
  }

  .bottom-controls {
    grid-template-columns: repeat(2, 1fr);
  }

  .rack {
    margin: 8px;
    padding: 8px;
  }
}

@media (max-width: 430px) {
  header {
    padding: 12px;
  }

  h1 {
    font-size: 17px;
  }

  .logo {
    width: 42px;
    height: 42px;
    font-size: 18px;
  }

  .top-controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">EQ</div>
    <div>
      <h1>GQX-3102</h1>
      <div class="subtitle">2 × 31 Band Graphic Equalizer</div>
    </div>
  </div>

  <div class="status" id="connectionStatus">
    ● ONLINE SIMULATOR
  </div>
</header>

<div class="toolbar">
  <button id="saveButton">SIMPAN SETTING</button>
  <button id="loadButton">MUAT SETTING</button>
  <button id="resetButton">RESET SEMUA</button>
  <button id="flatButton">FLAT 0 dB</button>
  <button id="bypassButton">EQ BYPASS</button>
</div>

<main class="rack">
  <div class="rack-title">
    <strong>GRAPHIC EQUALIZER</strong>
    <span>20 Hz – 20 kHz / 1⁄3 OCTAVE</span>
  </div>

  <section id="channels" class="channels"></section>
</main>

<div class="footer">
  Equalizer Online • Digital simulation inspired by a dual 31-band graphic equalizer
</div>

<script>
const frequencies = [
  "20", "25", "31.5", "40", "50", "63", "80", "100",
  "125", "160", "200", "250", "315", "400", "500", "630",
  "800", "1k", "1.25k", "1.6k", "2k", "2.5k", "3.15k",
  "4k", "5k", "6.3k", "8k", "10k", "12.5k", "16k", "20k"
];

const state = {
  bypass: false,
  channels: [
    createChannel(1),
    createChannel(2)
  ]
};

function createChannel(number) {
  return {
    id: number,
    gain: 0,
    hpf: 20,
    range: 15,
    eq: Array(31).fill(0),
    meter: 65,
    clip: false
  };
}

function formatDb(value) {
  return `${value > 0 ? "+" : ""}${value} dB`;
}

function renderChannels() {
  const container = document.getElementById("channels");
  container.innerHTML = "";

  state.channels.forEach((channel, channelIndex) => {
    const element = document.createElement("section");
    element.className = "channel";

    element.innerHTML = `
      <div class="channel-header">
        <h2>CHANNEL ${channel.id}</h2>
        <small>31 BAND / CONSTANT Q</small>
      </div>

      <div class="top-controls">
        <div class="control">
          <label>Overall Gain</label>
          <strong id="gainText-${channelIndex}">
            ${formatDb(channel.gain)}
          </strong>
          <input
            type="range"
            min="-60"
            max="6"
            step="1"
            value="${channel.gain}"
            data-channel="${channelIndex}"
            data-control="gain"
          >
        </div>

        <div class="control">
          <label>High Pass Filter</label>
          <strong id="hpfText-${channelIndex}">
            ${channel.hpf} Hz
          </strong>
          <input
            type="range"
            min="20"
            max="280"
            step="5"
            value="${channel.hpf}"
            data-channel="${channelIndex}"
            data-control="hpf"
          >
        </div>
      </div>

      <div class="meter-area">
        <div>
          <div class="control">
            <label>Output Level</label>
            <strong id="levelText-${channelIndex}">
              ${channel.meter}%
            </strong>
          </div>

          <div class="meter" id="meter-${channelIndex}">
            ${Array.from({length: 10}, () => "<span></span>").join("")}
          </div>
        </div>

        <div class="clip" id="clip-${channelIndex}">
          CLIP
        </div>
      </div>

      <div class="eq-wrapper">
        <div class="eq-scale">
          <span>+15</span>
          <span>+10</span>
          <span>+5</span>
          <span>0</span>
          <span>-5</span>
          <span>-10</span>
          <span>-15</span>
        </div>

        <div class="eq-bands">
          ${channel.eq.map((value, bandIndex) => `
            <div class="band">
              <div
                class="band-value"
                id="bandValue-${channelIndex}-${bandIndex}"
              >
                ${formatDb(value)}
              </div>

              <input
                type="range"
                min="-${channel.range}"
                max="${channel.range}"
                step="0.5"
                value="${value}"
                data-channel="${channelIndex}"
                data-band="${bandIndex}"
                data-control="eq"
                aria-label="Channel ${channel.id}, ${frequencies[bandIndex]} Hz"
              >

              <div class="band-frequency ${
                value === 0 ? "band-center" : ""
              }">
                ${frequencies[bandIndex]}
              </div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="bottom-controls">
        <div class="control">
          <label>EQ Range</label>
          <div class="range-buttons">
            <button
              class="${channel.range === 6 ? "active" : ""}"
              data-channel="${channelIndex}"
              data-action="range6"
            >
              ±6
            </button>

            <button
              class="${channel.range === 15 ? "active" : ""}"
              data-channel="${channelIndex}"
              data-action="range15"
            >
              ±15
            </button>
          </div>
        </div>

        <div class="control">
          <label>Channel Preset</label>
          <select
            data-channel="${channelIndex}"
            data-control="preset"
          >
            <option value="">Pilih...</option>
            <option value="flat">Flat</option>
            <option value="vocal">Vocal</option>
            <option value="speech">Speech</option>
            <option value="music">Music</option>
            <option value="bass">Bass Boost</option>
          </select>
        </div>

        <div class="control">
          <label>Filter Status</label>
          <strong>${state.bypass ? "BYPASS" : "ACTIVE"}</strong>
        </div>

        <div class="control">
          <label>Channel Status</label>
          <strong>READY</strong>
        </div>
      </div>

      <div class="eq-buttons">
        <button
          data-channel="${channelIndex}"
          data-action="flat"
        >
          FLAT
        </button>

        <button
          data-channel="${channelIndex}"
          data-action="random"
        >
          TEST SIGNAL
        </button>
      </div>
    `;

    container.appendChild(element);
    updateMeter(channelIndex);
  });
}

function updateValue(channelIndex, control, value) {
  const channel = state.channels[channelIndex];
  const numericValue = Number(value);

  if (control === "eq") {
    const bandIndex = arguments[3];
    channel.eq[bandIndex] = numericValue;

    const valueElement = document.getElementById(
      `bandValue-${channelIndex}-${bandIndex}`
    );

    if (valueElement) {
      valueElement.textContent = formatDb(numericValue);
    }
  } else {
    channel[control] = numericValue;

    if (control === "gain") {
      document.getElementById(`gainText-${channelIndex}`)
        .textContent = formatDb(numericValue);
    }

    if (control === "hpf") {
      document.getElementById(`hpfText-${channelIndex}`)
        .textContent = `${numericValue} Hz`;
    }
  }

  updateMeter(channelIndex);
}

function updateMeter(channelIndex) {
  const channel = state.channels[channelIndex];
  const meter = document.getElementById(`meter-${channelIndex}`);
  const clip = document.getElementById(`clip-${channelIndex}`);
  const levelText = document.getElementById(`levelText-${channelIndex}`);

  if (!meter) return;

  const eqEnergy = channel.eq.reduce(
    (sum, value) => sum + Math.abs(value),
    0
  );

  const level = Math.min(
    100,
    Math.round(channel.meter + eqEnergy / 5 + channel.gain)
  );

  levelText.textContent = `${level}%`;

  meter.querySelectorAll("span").forEach((bar, index) => {
    const threshold = ((index + 1) / 10) * 100;
    bar.style.opacity = level >= threshold ? "1" : ".18";
  });

  channel.clip = level >= 98;
  clip.style.background = channel.clip ? "#ff4757" : "#101214";
  clip.style.color = channel.clip ? "#ffffff" : "#ff4757";
}

function setFlat(channel) {
  channel.eq.fill(0);
  channel.gain = 0;
}

function applyPreset(channel, preset) {
  setFlat(channel);

  if (preset === "vocal") {
    channel.eq[5] = -2;
    channel.eq[10] = 2;
    channel.eq[14] = 4;
    channel.eq[18] = 3;
    channel.eq[23] = 2;
    channel.eq[27] = -2;
  }

  if (preset === "speech") {
    channel.eq[0] = -6;
    channel.eq[5] = -3;
    channel.eq[10] = 2;
    channel.eq[14] = 4;
    channel.eq[18] = 4;
    channel.eq[24] = -3;
  }

  if (preset === "music") {
    channel.eq[2] = 3;
    channel.eq[5] = 4;
    channel.eq[10] = -2;
    channel.eq[14] = -1;
    channel.eq[22] = 2;
    channel.eq[27] = 3;
  }

  if (preset === "bass") {
    channel.eq[0] = 5;
    channel.eq[2] = 5;
    channel.eq[5] = 4;
    channel.eq[10] = 2;
    channel.eq[18] = -2;
    channel.eq[25] = -3;
  }
}

document.addEventListener("input", event => {
  const input = event.target;

  if (input.dataset.control === "eq") {
    updateValue(
      Number(input.dataset.channel),
      "eq",
      input.value,
      Number(input.dataset.band)
    );
  }

  if (
    input.dataset.control === "gain" ||
    input.dataset.control === "hpf"
  ) {
    updateValue(
      Number(input.dataset.channel),
      input.dataset.control,
      input.value
    );
  }
});

document.addEventListener("change", event => {
  const input = event.target;

  if (input.dataset.control === "preset") {
    const channel = state.channels[Number(input.dataset.channel)];

    if (input.value) {
      applyPreset(channel, input.value);
      renderChannels();
    }
  }
});

document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const channel = state.channels[Number(button.dataset.channel)];
  const action = button.dataset.action;

  if (action === "range6") {
    channel.range = 6;
  }

  if (action === "range15") {
    channel.range = 15;
  }

  if (action === "flat") {
    setFlat(channel);
  }

  if (action === "random") {
    channel.meter = Math.floor(Math.random() * 100);
  }

  renderChannels();
});

document.getElementById("flatButton").addEventListener("click", () => {
  state.channels.forEach(setFlat);
  renderChannels();
  setStatus("Semua channel dikembalikan ke 0 dB.");
});

document.getElementById("bypassButton").addEventListener("click", event => {
  state.bypass = !state.bypass;
  event.currentTarget.classList.toggle("active", state.bypass);
  renderChannels();
  setStatus(state.bypass ? "EQ BYPASS aktif." : "EQ aktif kembali.");
});

document.getElementById("saveButton").addEventListener("click", () => {
  localStorage.setItem("gqx3102Settings", JSON.stringify(state));
  setStatus("Setting GQX-3102 berhasil disimpan.");
});

document.getElementById("loadButton").addEventListener("click", () => {
  const saved = localStorage.getItem("gqx3102Settings");

  if (!saved) {
    setStatus("Belum ada setting yang disimpan.");
    return;
  }

  Object.assign(state, JSON.parse(saved));
  renderChannels();
  setStatus("Setting berhasil dimuat.");
});

document.getElementById("resetButton").addEventListener("click", () => {
  state.bypass = false;
  state.channels = [
    createChannel(1),
    createChannel(2)
  ];

  renderChannels();
  setStatus("Semua setting telah di-reset.");
});

function setStatus(message) {
  document.getElementById("connectionStatus").textContent = `● ${message}`;
}

renderChannels();
</script>

</body>
</html>
