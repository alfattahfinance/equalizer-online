name: Build Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/equalizer-online-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: equalizer-online-apk
          path: release/equalizer-online-debug.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: equalizer-online-apk
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Equalizer Online APK ${{ github.run_number }}
          body: |
            APK otomatis dibuat dari commit:
            ${{ github.sha }}
          files: release/equalizer-online-debug.apk
          generate_release_notes: true
